apiVersion: apps/v1
kind: Deployment

metadata:
  name: url-shortener

spec:
  replicas: 2

  selector:
    matchLabels:
      app: url-shortener

  template:
    metadata:
      labels:
        app: url-shortener

    spec:
      containers:
        - name: url-shortener
          image: ghcr.io/akankshab137/url-shortener:v3
          ports:
            - containerPort: 5000

          env: 
            - name: BASE_URL
              value: "http://node01:30080" 
